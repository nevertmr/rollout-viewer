# NAS 배포용. 이 파일이 있는 디렉터리(= dist/)를 그대로 올려서 사용한다.
#
#   1) 뷰어 프론트엔드를 여기로 복사   cp ../index.html . && cp -R ../static .
#      (index.html 과 static/ 이 없으면 안내 페이지가 뜬다)
#   2) docker compose up -d --build
#   3) 확인   curl http://<NAS>:8081/healthz
name: rollout-viewer

services:
  rollout-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: rollout-viewer:latest
    container_name: rollout-viewer
    restart: unless-stopped
    user: "1000:10"
    environment:
      VIEW_PORT: "8081"
      VIEW_HOST: "0.0.0.0"
      VIEW_ROOT: "/app"
    ports:
      - "8081:8081"
    volumes:
      # 데이터는 이미지에 굽지 않고 bind mount 한다 (읽기 전용)
      - ./clips:/app/clips:ro
      - ./api:/app/api:ro
