<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rollout viewer</title>
<!-- 서버에 favicon.ico 라우트가 없어 콘솔에 404 가 남는다. 빈 아이콘으로 막는다. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/viewer.css">
</head>
<body>

<div class="app">
  <!-- ── 사이드바 ───────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="side-top">
      <div class="stats" id="stats"></div>
    </div>
    <div class="cols">
      <div class="col col-try">
        <div class="side-h">Try <span class="n" id="rcount"></span></div>
        <div class="clist" id="rlist" role="listbox" aria-label="Try list"></div>
      </div>
      <div class="col col-task">
        <div class="side-h">Task <span class="n" id="tcount"></span></div>
        <div class="clist" id="tlist" role="listbox" aria-label="Task list"></div>
      </div>
    </div>
  </aside>

  <!-- ── 메인 ───────────────────────────────────────────────────── -->
  <main class="main" id="main">
    <div class="wrap">
      <div class="mhead">
        <h1 id="gTitle">rollout viewer</h1>
        <div class="sub lbl" id="gSub">loading…</div>
      </div>

      <div class="ahead">
        <span class="lbl">Attempts</span>
        <span class="lbl n" id="aCount"></span>
        <label class="atoggle" title="When on, every attempt of this group is drawn on the cards and charts">
          <input type="checkbox" id="showAll">Show all attempts
        </label>
      </div>

      <div class="attempts" id="attempts"></div>

      <div class="panel instr">
        <div class="lbl">Language instruction</div>
        <div class="txt" id="instr">—</div>
      </div>

      <div class="charts" id="charts"></div>
    </div>

    <!-- 재생바 -->
    <div class="playbar">
      <button class="pbtn32" id="bBack" title="back 5s" aria-label="back 5 seconds">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6L11 18zm.5-6l8.5 6V6l-8.5 6z"/></svg>
      </button>
      <button class="pbtn32" id="bPlay" title="play/pause (Space)" aria-label="play or pause">
        <svg id="icPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button class="pbtn32" id="bFwd" title="forward 5s" aria-label="forward 5 seconds">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8.5-6L13 6zm-.5 6L4 6v12l8.5-6z"/></svg>
      </button>
      <button class="pbtn32" id="bReset" title="restart" aria-label="restart from the beginning">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1"
             title="seek" aria-label="seek">
      <div class="tdisp" id="tdisp">0.00 / 0.00 s</div>
      <div class="hints">
        <span class="kbd">Space</span> play/pause
        <span class="kbd">←→</span> frame
        <span class="kbd">↑↓</span> task
        <span class="kbd">⇧↑↓</span> try
        <span class="kbd">[ ]</span> attempt
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/static/js/config.js"></script>
<script src="/static/js/state.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/media.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
