<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rollout viewer</title>
<!-- 서버에 favicon.ico 라우트가 없어 콘솔에 404 가 남는다. 빈 아이콘으로 막는다. -->
<link rel="icon" href="data:,">
<style>
/* ── 전역 토큰 (참조 규격) ───────────────────────────────────────── */
:root{
  --bg:rgb(10,14,23);
  --fg:rgb(231,235,243);
  --panel-bg:rgba(30,41,59,0.4);
  --panel-bd:rgba(255,255,255,0.10);
  --muted:#94a3b8;
  --title:#e2e8f0;
  --cyan:#22d3ee;
  --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --dim:#64748b;
  --pad:13.5px;
  --r:9px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:Inter,-apple-system,"Segoe UI",sans-serif;
  font-size:18px; line-height:1.35;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(34,211,238,0.3)}

/* 스크롤바 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ── 패널(카드) 공통 ─────────────────────────────────────────────── */
.panel{
  background:var(--panel-bg);
  border:1px solid var(--panel-bd);
  border-radius:var(--r);
  padding:var(--pad);
}
.lbl{font-size:11px;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase}

/* ── 앱 레이아웃 ─────────────────────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}

/* 좌측 사이드바 320px 고정 — 통계 블록 위, 그 아래 Finder 컬럼 뷰(TRY | TASK) */
.sidebar{
  flex:0 0 320px;width:320px;
  border-right:1px solid rgba(255,255,255,0.08);
  background:var(--bg);
  overflow:hidden;
  padding:var(--pad);
  display:flex;flex-direction:column;
}
.side-top{flex:0 0 auto}
.stats{display:flex;flex-wrap:wrap;gap:12px 16px;margin-bottom:10px}
.stat{min-width:60px}
.stat .v{font-size:18px;color:#e7ebf3;line-height:1.2}

.side-h{
  font-size:11px;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase;
  margin:6px 0 6px;display:flex;align-items:center;gap:5px;flex:0 0 auto;
}
.side-h .n{color:var(--dim);letter-spacing:0}

/* 맥 Finder 컬럼 뷰 — 좌우로 나란한 세로 목록 2개, 각자 독립 스크롤 */
.cols{flex:1 1 auto;min-height:0;display:flex;align-items:stretch}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;min-height:0}
.col-try{padding-right:9px}
.col-task{padding-left:9px;border-left:1px solid rgba(255,255,255,0.08)}
.clist{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;gap:2px;padding-bottom:8px;
}
.clist::-webkit-scrollbar{width:7px}

/* Finder 행 — 선택 시 배경 강조 + 오른쪽 끝 셰브론 */
.row{
  position:relative;display:flex;align-items:center;gap:6px;width:100%;
  /* flex 컬럼 안에서 행이 눌리면 스크롤 대신 찌그러진다 — 축소 금지 */
  flex:0 0 auto;min-height:24px;
  border:1px solid transparent;border-radius:5px;
  padding:4px 15px 5px 7px;cursor:pointer;background:transparent;
  text-align:left;color:var(--muted);overflow:hidden;
}
.row:hover{background:rgba(255,255,255,0.05)}
.row.on{background:rgba(34,211,238,0.14);border-color:rgba(34,211,238,0.40)}
.row.on::after{
  content:"\203A";position:absolute;right:5px;top:50%;transform:translateY(-50%);
  font-size:13px;line-height:1;color:var(--cyan);
}
.row .nm{
  font-size:12px;font-variant-numeric:tabular-nums;color:#cbd5e1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row.on .nm{color:#f1f5f9}
/* 실패가 섞인 태스크 비율 — 행 아래 얇은 막대. 어느 트라이가 험한지 한눈에 훑으라고. */
.row .meter{position:absolute;left:0;bottom:0;height:2px;background:var(--bad);opacity:0.8}
.row .meter.warn{background:var(--warn)}
.badges{display:flex;gap:2px;margin-left:auto;flex:0 0 auto}
.bdg{
  font-size:9.5px;line-height:1;font-weight:600;padding:2px 4px;border-radius:3px;
  background:rgba(255,255,255,0.06);color:var(--muted);
}
.bdg.success{background:rgba(34,197,94,0.18);color:#4ade80}
.bdg.fail{background:rgba(239,68,68,0.18);color:#f87171}
.bdg.unstable{background:rgba(245,158,11,0.18);color:#fbbf24}
.bdg.deleted{background:rgba(255,255,255,0.06);color:#64748b;text-decoration:line-through}

/* 메인 */
.main{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column}
.wrap{max-width:1008px;width:100%;margin:0 auto;padding:20px var(--pad) 0;flex:1 0 auto}

.mhead{margin-bottom:14px}
.mhead h1{font-size:24px;font-weight:600;margin:0;color:#f1f5f9;line-height:1.2}
.mhead .sub{margin-top:4px}

/* 시도 열 */
/* 시도 영역 머리줄 — ATTEMPTS 라벨 + "전체 시도 보기" 토글 */
.ahead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ahead .n{color:var(--dim);letter-spacing:0;text-transform:none}
.atoggle{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;
}
.atoggle:hover{color:#e2e8f0}
.atoggle input{width:13px;height:13px;margin:0;cursor:pointer;accent-color:var(--cyan)}
.attempts{display:flex;gap:var(--pad);overflow-x:auto;padding-bottom:4px;margin-bottom:var(--pad)}
.acard{flex:0 0 calc((100% - 3 * var(--pad)) / 4);min-width:232px;display:flex;flex-direction:column;gap:8px}
.acard.focus{border-color:rgba(34,211,238,0.45);box-shadow:0 0 0 1px rgba(34,211,238,0.18)}
.arow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.aname{font-size:13.5px;font-weight:600;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{
  font-size:11px;color:var(--muted);background:rgba(255,255,255,0.05);
  border-radius:4px;padding:2px 6px;border:0;cursor:default;white-space:nowrap;
}
button.chip{cursor:pointer}
button.chip:hover{color:#f1f5f9;background:rgba(255,255,255,0.09)}
button.chip.on{color:var(--cyan);background:rgba(34,211,238,0.15)}
/* 탑(front) 위 · 손목(wrist) 아래 세로 스택 — 두 카메라 동시 표시 */
.media{width:100%;background:#000;border-radius:6px;overflow:hidden;
       display:grid;grid-template-rows:1fr 1fr;gap:2px}
.pane{position:relative;width:100%;aspect-ratio:4/3;background:#000;overflow:hidden}
.pane video,.pane img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.pane .camlabel{position:absolute;left:6px;top:6px;z-index:2}
.memo{font-size:12px;color:#cbd5e1;min-height:16px;word-break:break-word}
.memo:empty::after{content:"—";color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
/* 지시문 박스 */
.instr{margin-bottom:var(--pad)}
.instr .txt{font-size:18px;color:#e7ebf3;margin-top:4px}

/* 차트 그리드 */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:var(--pad);margin-bottom:var(--pad)}
.cpanel{min-width:0}
.ctitle{font-size:13.5px;font-weight:600;color:var(--title);margin-bottom:4px}
.cpanel svg{width:100%;height:auto;display:block}

/* 차트 하단 범례 */
.legend{margin-top:6px;display:flex;flex-direction:column;gap:5px}
.lg-j{font-size:13.5px}
.lg-j > label{display:flex;align-items:center;gap:6px;color:#e7ebf3;cursor:pointer}
.lg-sub{margin-left:18px;margin-top:2px;display:flex;flex-direction:column;gap:1px}
.lg-sub label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.lg-sub .val{margin-left:auto;font-variant-numeric:tabular-nums;color:#cbd5e1}
.legend input[type=checkbox]{width:13px;height:13px;margin:0;cursor:pointer}

/* ── 하단 재생바 (sticky) ────────────────────────────────────────── */
.playbar{
  position:sticky;bottom:0;z-index:20;
  margin:0 auto;max-width:1008px;width:calc(100% - 27px);height:61px;
  /* .main 이 flex column 이라 기본 flex-shrink:1 이면 내용이 넘칠 때 61px 이 눌린다 */
  flex:0 0 61px;
  display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,0.03);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:6.75px;
  padding:9px 13.5px;
  margin-bottom:var(--pad);
}
.pbtn32{
  width:32px;height:32px;flex:0 0 32px;border-radius:6px;border:1px solid transparent;
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.pbtn32 svg{width:14px;height:14px;display:block}
.pbtn32:hover{color:#f1f5f9;background:rgba(255,255,255,0.05)}
.pbtn32.active{background:rgba(34,211,238,0.15);color:var(--cyan);border:1px solid rgba(34,211,238,0.4)}
.seek{
  flex:1;min-width:80px;height:32px;appearance:none;background:transparent;cursor:pointer;margin:0;
}
.seek::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--cyan) 0 var(--pct,0%),rgba(255,255,255,0.15) var(--pct,0%) 100%);
}
.seek::-webkit-slider-thumb{
  appearance:none;width:12px;height:12px;border-radius:50%;background:var(--cyan);
  margin-top:-4px;border:0;
}
.seek::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,0.15)}
.seek::-moz-range-progress{height:4px;border-radius:2px;background:var(--cyan)}
.seek::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--cyan)}
.tdisp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hints{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.kbd{
  font-size:11px;padding:1px 5px;border-radius:4px;
  background:rgba(255,255,255,0.06);border:1px solid var(--panel-bd);color:#cbd5e1;
}
@media (max-width:1100px){.hints{display:none}}

.empty{color:var(--muted);font-size:13.5px;padding:24px 0}
.clist .empty{flex:0 0 auto;font-size:12px;padding:8px 0}
.toast{
  position:fixed;left:50%;bottom:82px;transform:translateX(-50%);
  background:rgba(30,41,59,0.95);border:1px solid var(--panel-bd);border-radius:6px;
  padding:7px 13.5px;font-size:12px;color:#e7ebf3;opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:50;
}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="app">
  <!-- ── 사이드바 ───────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="side-top">
      <div class="stats" id="stats"></div>
    </div>
    <div class="cols">
      <div class="col col-try">
        <div class="side-h">Try <span class="n" id="rcount"></span></div>
        <div class="clist" id="rlist" role="listbox" aria-label="Try list"></div>
      </div>
      <div class="col col-task">
        <div class="side-h">Task <span class="n" id="tcount"></span></div>
        <div class="clist" id="tlist" role="listbox" aria-label="Task list"></div>
      </div>
    </div>
  </aside>

  <!-- ── 메인 ───────────────────────────────────────────────────── -->
  <main class="main" id="main">
    <div class="wrap">
      <div class="mhead">
        <h1 id="gTitle">rollout viewer</h1>
        <div class="sub lbl" id="gSub">loading…</div>
      </div>

      <div class="ahead">
        <span class="lbl">Attempts</span>
        <span class="lbl n" id="aCount"></span>
        <label class="atoggle" title="When on, every attempt of this group is drawn on the cards and charts">
          <input type="checkbox" id="showAll">Show all attempts
        </label>
      </div>

      <div class="attempts" id="attempts"></div>

      <div class="panel instr">
        <div class="lbl">Language instruction</div>
        <div class="txt" id="instr">—</div>
      </div>

      <div class="charts" id="charts"></div>
    </div>

    <!-- 재생바 -->
    <div class="playbar">
      <button class="pbtn32" id="bBack" title="back 5s" aria-label="back 5 seconds">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6L11 18zm.5-6l8.5 6V6l-8.5 6z"/></svg>
      </button>
      <button class="pbtn32" id="bPlay" title="play/pause (Space)" aria-label="play or pause">
        <svg id="icPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button class="pbtn32" id="bFwd" title="forward 5s" aria-label="forward 5 seconds">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8.5-6L13 6zm-.5 6L4 6v12l8.5-6z"/></svg>
      </button>
      <button class="pbtn32" id="bReset" title="restart" aria-label="restart from the beginning">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1"
             title="seek" aria-label="seek">
      <div class="tdisp" id="tdisp">0.00 / 0.00 s</div>
      <div class="hints">
        <span class="kbd">Space</span> play/pause
        <span class="kbd">←→</span> frame
        <span class="kbd">↑↓</span> task
        <span class="kbd">⇧↑↓</span> try
        <span class="kbd">[ ]</span> attempt
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   상수 — 참조 규격 좌표계 그대로
   ══════════════════════════════════════════════════════════════════ */
const SVGNS = "http://www.w3.org/2000/svg";
const JOINTS = ["shoulder_pan.pos","shoulder_lift.pos","elbow_flex.pos",
                "wrist_flex.pos","wrist_roll.pos","gripper.pos"];
const SERIES_COLORS = ["#f97316","#3b82f6","#22c55e"];   // 1·2·3번째 시리즈 색
const CHART_SPECS = [{joints:[0,1,2]}, {joints:[3,4]}, {joints:[5]}];

const VB   = "0 0 673 324";      // viewBox
const X0=47, X1=661, Y0=12, Y1=286;      // 플롯 영역
const GRID_Y = [12, 80.5, 149, 217.5, 286];
const GRID_COLOR = "rgb(51,65,85)";
const TICK_FILL  = "rgb(148,163,184)";
const MAXPTS = 700;              // 다운샘플 상한
const CAMS = ["front","wrist"];  // 카드마다 두 카메라를 동시에 띄운다(위: front, 아래: wrist)
const OC_INIT  = {success:"S", fail:"F", unstable:"U", unlabeled:"?", deleted:"D"};

/* ══════════════════════════════════════════════════════════════════
   상태
   ══════════════════════════════════════════════════════════════════ */
const S = {
  idx:null,
  runs:[],           // [{run, no, groups:[…], fail, unstable, multiCycle}] — 사이드바 1단
  byGid:new Map(),   // gid -> group
  run:null,          // 선택된 런 이름
  gid:null, group:null,
  eps:{},            // eid -> episode payload (현재 표시 중인 것만)
  epsAll:{},         // eid -> episode payload (현재 그룹에서 한 번이라도 받은 것 — 토글 시 재요청 방지)
  order:[],          // 표시 순서 eid
  showAll:false,     // "전체 시도 보기" — 끄면 그룹당 대표 시도 1개만 (그룹을 바꿔도 유지)
  focus:null,        // 포커스된 eid
  useFrames:{},      // "eid|cam" -> true (clip 실패 시 프레임 폴백, 카메라별로 따로)
  T:0, dur:0, fps:30, playing:false,
  hidden:new Set(),  // "j|kind" 숨김
  charts:[],         // 렌더된 차트 핸들
  ac:null,           // AbortController
};

/* ══════════════════════════════════════════════════════════════════
   유틸
   ══════════════════════════════════════════════════════════════════ */
const $  = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; };
const sv = (tag, attrs) => { const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const fx = (v,n) => (v==null||!isFinite(v)) ? "—" : Number(v).toFixed(n);

let toastT=null;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1400);
}

async function getJSON(url, signal){
  const r = await fetch(url, {signal});
  if(!r.ok) throw new Error(url+" → "+r.status);
  return r.json();
}
/* ══════════════════════════════════════════════════════════════════
   부트스트랩
   ══════════════════════════════════════════════════════════════════ */
init();
async function init(){
  try{
    const idx = await getJSON("/api/index");
    S.idx = idx;
    S.fps = idx.fps || 30;
    renderStats();
    buildTree();
    renderRuns();
    if(S.runs.length) selectRun(S.runs[0].run);   // 첫 런의 첫 태스크까지 열린다
    else { renderTasks(); clearMain(); $("gSub").textContent = "no groups"; }
  }catch(e){
    $("gSub").textContent = "failed to load index: " + e.message;
  }
}

/* ── 사이드바 통계 ────────────────────────────────────────────────── */
function renderStats(){
  const tot = S.idx.totals || {};
  const by  = tot.by_outcome || {};
  const box = $("stats"); box.textContent="";
  const items = [
    ["episodes", tot.episodes ?? "—"],
    ["groups",   tot.groups   ?? "—"],
    ["fps",      S.fps],
    ["success",  by.success ?? 0],
    ["fail",     by.fail ?? 0],
    ["deleted",  by.deleted ?? 0],
  ];
  for(const [k,v] of items){
    const d = el("div","stat");
    d.appendChild(el("div","lbl",k));
    d.appendChild(el("div","v",String(v)));
    box.appendChild(d);
  }
}

/* ══════════════════════════════════════════════════════════════════
   사이드바 트리 — 런(트라이) → 태스크(스텝) 2단
   ══════════════════════════════════════════════════════════════════ */
/* "coffee_new07" → "7". 숫자가 없으면 등장 순서로 매긴다. */
function runNo(run, i){
  const m = /(\d+)\s*$/.exec(String(run||""));
  return m ? String(Number(m[1])) : String(i+1);
}
function curRun(){ return S.runs.find(r=>r.run===S.run) || null; }
function curTasks(){ const r=curRun(); return r ? r.groups : []; }

function buildTree(){
  S.byGid = new Map();
  const map = new Map();                      // run -> groups
  const order = (S.idx.runs||[]).slice();     // 인덱스가 준 런 순서를 그대로 쓴다
  for(const g of (S.idx.groups||[])){
    S.byGid.set(g.gid, g);
    if(!map.has(g.run)){ map.set(g.run, []); if(order.indexOf(g.run)<0) order.push(g.run); }
    map.get(g.run).push(g);
  }
  S.runs = order.filter(r=>map.has(r)).map((run,i)=>{
    const gs = map.get(run).slice().sort((a,b)=> (a.cycle-b.cycle) || (a.step-b.step));
    let fail=0, unstable=0;            // 실패/불안정이 섞인 "태스크" 수
    for(const g of gs){
      const live = (g.attempts||[]).filter(a=>!a.deleted);
      if(live.some(a=>a.outcome==="fail")) fail++;
      else if(live.some(a=>a.outcome==="unstable")) unstable++;
    }
    const cycles = new Set(gs.map(g=>g.cycle));
    return {run, no:runNo(run,i), groups:gs, fail, unstable, multiCycle:cycles.size>1};
  });
}

/* 왼쪽 컬럼: 트라이 세로 목록 (Finder 1열) */
function renderRuns(){
  const box = $("rlist"); box.textContent="";
  $("rcount").textContent = "(" + S.runs.length + ")";
  for(const r of S.runs){
    const b = el("button","row" + (r.run===S.run ? " on" : ""));
    b.setAttribute("role","option");
    b.setAttribute("aria-selected", r.run===S.run ? "true" : "false");
    b.appendChild(el("span","nm","Try " + r.no));
    const n = r.groups.length || 1;
    if(r.fail || r.unstable){
      const m = el("span","meter" + (r.fail ? "" : " warn"));
      m.style.width = (100 * (r.fail || r.unstable) / n).toFixed(1) + "%";
      b.appendChild(m);
    }
    // 원래 런 이름은 폭이 좁으니 툴팁으로
    b.title = r.run + " · " + r.groups.length + " tasks"
            + (r.fail ? " · fail " + r.fail : "") + (r.unstable ? " · unstable " + r.unstable : "");
    b.dataset.run = r.run;
    b.onclick = ()=>selectRun(r.run);
    box.appendChild(b);
  }
}

/* 오른쪽 컬럼: 선택된 트라이의 태스크 세로 목록 (Finder 2열) */
function renderTasks(){
  const box = $("tlist"); box.textContent="";
  const r = curRun(), gs = r ? r.groups : [];
  $("tcount").textContent = "(" + gs.length + ")";
  if(!gs.length){ box.appendChild(el("div","empty","Select a try")); return; }
  for(const g of gs){
    const b = el("button","row" + (g.gid===S.gid ? " on" : ""));
    b.setAttribute("role","option");
    b.setAttribute("aria-selected", g.gid===S.gid ? "true" : "false");
    b.dataset.gid = g.gid;
    b.appendChild(el("span","nm", (r.multiCycle ? "c"+g.cycle+" · " : "") + "Task " + g.step));
    const bd = el("span","badges");
    for(const a of (g.attempts||[])){
      const oc = a.deleted ? "deleted" : (a.outcome||"unlabeled");
      bd.appendChild(el("span","bdg "+oc, OC_INIT[oc]||"?"));
    }
    b.appendChild(bd);
    // 지시문 요약은 폭이 좁으니 툴팁으로
    b.title = "Task " + g.step + (g.instruction ? " · " + g.instruction : "");
    b.onclick = ()=>selectGroup(g.gid);
    box.appendChild(b);
  }
}

/* 런 선택 → 태스크 칸 갱신. 같은 스텝을 유지해 런끼리 바로 비교되게 한다. */
function selectRun(run){
  const r = S.runs.find(x=>x.run===run); if(!r) return;
  const keepStep = S.group ? S.group.step : null;
  S.run = run;
  renderRuns(); renderTasks();
  const next = r.groups.find(g=>g.step===keepStep) || r.groups[0];
  if(next) selectGroup(next.gid);
  else clearMain();
}

/* 표시할 그룹이 없을 때 메인을 비운다 */
function clearMain(){
  if(S.ac) S.ac.abort();
  pause();
  S.gid=null; S.group=null; S.eps={}; S.epsAll={}; S.order=[]; S.focus=null;
  S.T=0; S.dur=0; S.charts=[];
  $("gTitle").textContent = "rollout viewer";
  $("gSub").textContent   = "no group to show";
  $("instr").textContent  = "—";
  $("aCount").textContent = "";
  $("attempts").textContent = "";
  $("charts").textContent = "";
  updateCursor();
}

/* ══════════════════════════════════════════════════════════════════
   그룹 선택 / 에피소드 로드
   ══════════════════════════════════════════════════════════════════ */
/* 그룹의 대표 시도 하나 — 기본 표시는 이것만이다.
   1) 삭제되지 않은 시도 중 outcome==="success" 인 마지막(attempt 최대) 시도
   2) 성공이 없으면 마지막 unstable 시도 (unstable 로 끝난 그룹들)
   3) 그것도 없으면 마지막 시도, 전부 삭제분이면 원본의 마지막 시도 */
function pickDefaultAttempt(atts){
  if(!atts || !atts.length) return null;
  const byNo = atts.slice().sort((a,b)=> (a.attempt||0) - (b.attempt||0));
  const live = byNo.filter(a=>!a.deleted);
  const pool = live.length ? live : byNo;
  const last = (oc)=>{ for(let i=pool.length-1;i>=0;i--) if(pool[i].outcome===oc) return pool[i]; return null; };
  return last("success") || last("unstable") || pool[pool.length-1];
}
/* 화면에 올릴 시도 목록 — 토글이 꺼져 있으면 대표 시도 하나 */
function visibleAttempts(g){
  const atts = (g && g.attempts) ? g.attempts.slice() : [];
  if(S.showAll || atts.length<=1) return atts;
  const pick = pickDefaultAttempt(atts);
  return pick ? [pick] : atts;
}

async function selectGroup(gid, opts){
  const keepT = !!(opts && opts.keepT);
  const prevT = S.T;
  if(S.ac) S.ac.abort();                       // 진행 중 fetch 취소
  const ac = new AbortController(); S.ac = ac;

  pause();
  if(S.gid !== gid) S.epsAll = {};             // 그룹이 바뀌면 에피소드 캐시를 버린다
  S.gid = gid;
  S.group = S.byGid.get(gid) || null;
  if(S.group && S.group.run !== S.run) S.run = S.group.run;   // 다른 런의 그룹을 직접 열어도 트리가 따라온다
  S.eps = {}; S.order = []; S.focus = null; S.T=0; S.dur=0;
  // 이전 그룹의 차트 핸들은 곧 DOM 에서 떨어져 나간다. 로드가 실패해 buildCharts()
  // 까지 못 가면 updateCursor() 가 죽은 노드를 계속 만지므로 여기서 비운다.
  S.charts = [];
  renderRuns(); renderTasks();

  const g = S.group;
  if(!g){ renderAttemptCount(0,0); return; }
  const rno = (curRun()||{}).no || "?";
  const total = (g.attempts||[]).length;
  $("gTitle").textContent = "Try " + rno + " · Task " + g.step;
  $("instr").textContent  = g.instruction || "—";
  $("attempts").textContent = "";
  $("charts").textContent = "";
  $("charts").appendChild(el("div","empty","loading charts…"));

  const atts = visibleAttempts(g);
  const pick = atts[0];
  $("gSub").textContent   = g.run + " · c" + g.cycle + " · " + g.gid
                          + " · " + total + (total===1 ? " attempt" : " attempts")
                          + (atts.length < total
                              ? " · showing final " + (pick ? (pick.deleted ? "deleted" : (pick.outcome||"unlabeled")) : "—")
                                + " only (attempt " + (pick ? (pick.attempt||1) : "—") + ")"
                              : "");
  renderAttemptCount(atts.length, total);
  S.order = atts.map(a=>a.eid);
  renderAttempts(atts);                         // 영상/컨트롤 먼저

  // 에피소드 병렬 로드 (같은 그룹에서 토글만 바꾼 경우 캐시 재사용 — 재요청 없음)
  let loaded = 0;
  await Promise.all(atts.map(async a=>{
    if(S.epsAll[a.eid]){ S.eps[a.eid] = S.epsAll[a.eid]; loaded++; return; }
    try{
      const ep = await getJSON("/api/episode?eid="+encodeURIComponent(a.eid), ac.signal);
      if(ac.signal.aborted) return;
      S.epsAll[a.eid] = ep; S.eps[a.eid] = ep; loaded++;
    }catch(e){ if(e.name!=="AbortError") console.warn("episode load failed", a.eid, e); }
  }));
  if(ac.signal.aborted) return;

  S.fps = (S.eps[S.order[0]] || {}).fps || S.fps;
  S.dur = Math.max(0, ...S.order.map(eid=>epDur(S.eps[eid])));
  S.focus = S.order[0] || null;
  if(!loaded){ $("charts").textContent=""; $("charts").appendChild(el("div","empty","failed to load episodes")); return; }

  buildCharts();
  applyFocus();
  seekTo(keepT ? prevT : 0);
}

/* 시도 머리줄의 개수 표시 — 숨긴 시도가 있다는 사실은 여기서 드러난다 */
function renderAttemptCount(shown, total){
  $("aCount").textContent = total ? (shown < total ? "(" + shown + " / " + total + ")" : "(" + total + ")") : "";
}

/* "전체 시도 보기" 토글 — 상태는 전역이라 그룹을 바꿔도 유지된다 */
$("showAll").onchange = (e)=>{
  S.showAll = !!e.target.checked;
  e.target.blur();                              // 포커스를 놔줘야 Space 가 다시 재생 토글로 간다
  if(S.gid) selectGroup(S.gid, {keepT:true});
};

function epDur(ep){
  if(!ep || !ep.t || !ep.t.length) return 0;
  return ep.t[ep.t.length-1] || 0;
}
function trimTime(ep){
  if(!ep || !ep.t) return null;
  const tf = ep.trim_from;
  if(!(typeof tf === "number") || tf<=0 || tf>=ep.t.length) return null;
  return ep.t[tf];
}

/* ══════════════════════════════════════════════════════════════════
   시도 카드
   ══════════════════════════════════════════════════════════════════ */
function renderAttempts(atts){
  const box = $("attempts"); box.textContent="";
  atts.forEach((a,i)=>{
    const eid = a.eid;
    const card = el("div","panel acard"); card.dataset.eid = eid;
    card.onmousedown = ()=>setFocus(eid);

    // 헤더: 시도 번호 + 결과 배지
    const h = el("div","arow");
    h.appendChild(el("div","aname","Attempt " + (a.attempt||i+1) + " · ep" + a.ep));
    const oc = a.deleted ? "deleted" : (a.outcome||"unlabeled");
    h.appendChild(el("span","bdg "+oc, oc));
    card.appendChild(h);

    // 영상: front(위) / wrist(아래) 두 카메라를 동시에
    const media = el("div","media");
    for(const cam of CAMS){
      const pane = el("div","pane"); pane.dataset.cam = cam;
      const v = el("video"); v.muted=true; v.playsInline=true; v.preload="auto";
      v.setAttribute("playsinline",""); v.dataset.eid=eid; v.dataset.cam=cam;
      // 핸들러/타이머는 카드가 다시 그려지면 폐기된 DOM에 남는다.
      // isConnected 로 걸러 내지 않으면 죽은 엘리먼트가 전역 상태를 덮어쓴다.
      v.onerror = ()=>{ if(v.isConnected) toFrames(eid, cam, v); };
      v.onloadeddata = ()=>{ clearTimeout(v._wd); if(v.isConnected) backToVideo(eid, cam, v); };
      const img = el("img"); img.style.display="none"; img.alt=""; img.dataset.cam=cam;
      // 프레임이 없는 에피소드(삭제분 등)는 /frame 이 404 → 깨진 이미지 아이콘이 뜬다. 그냥 검은 박스로 둔다.
      img.onerror = ()=>{ img.style.visibility="hidden"; };
      img.onload  = ()=>{ img.style.visibility="visible"; };
      pane.appendChild(v); pane.appendChild(img);
      pane.appendChild(el("span","chip camlabel", cam));   // 토글이 아니라 라벨
      media.appendChild(pane);
    }
    card.appendChild(media);
    initMedia(eid, card);

    // 메모
    card.appendChild(el("div","memo", a.memo || ""));

    // 지표 칩
    const m = a.metrics || {};
    const chips = el("div","chips");
    chips.appendChild(el("span","chip","jerk p95 " + fx(m.jerk_p95,2)));
    chips.appendChild(el("span","chip","track " + fx(m.track_err,2)));
    chips.appendChild(el("span","chip","rev " + fx(m.reversals,1)));
    chips.appendChild(el("span","chip","frames " + (a.n_frames ?? "—")));
    card.appendChild(chips);

    box.appendChild(card);
  });
}

function cardOf(eid){ return document.querySelector('.acard[data-eid="'+CSS.escape(eid)+'"]'); }
function paneOf(card, cam){ return card ? card.querySelector('.pane[data-cam="'+cam+'"]') : null; }
const fkey = (eid, cam) => eid + "|" + cam;

/* 현재 살아있는 카드에 영상/프레임 모드를 반영 (카메라 하나 또는 전부) */
function applyMediaMode(eid, cam){
  const c = cardOf(eid); if(!c) return;
  for(const cm of (cam ? [cam] : CAMS)){
    const p = paneOf(c, cm); if(!p) continue;
    const v = p.querySelector("video"), img = p.querySelector("img");
    if(!v || !img) continue;
    const useF = !!S.useFrames[fkey(eid, cm)];
    v.style.display   = useF ? "none" : "block";
    img.style.display = useF ? "block" : "none";
  }
}
/* 영상 → 프레임 스크럽 폴백 (에러 / 로드 지연 공통) — 카메라 단위 */
/* 프레임 서빙 가능 여부 — 배포본은 원본 프레임이 없어 /frame 이 404 다.
   그 환경에서 프레임 폴백으로 넘어가면 화면이 그냥 검게 남으므로, 한 번 확인해서
   불가능하면 폴백을 쓰지 않고 영상 로딩을 계속 기다린다(탭이 백그라운드라 느린 경우 등). */
let FRAMES_OK = null, framesProbe = null;
function probeFrames(){
  if(framesProbe) return framesProbe;
  const any = S.order && S.order[0];
  if(!any) return Promise.resolve(true);
  framesProbe = fetch("/frame?eid="+encodeURIComponent(any)+"&cam=front&i=0", {method:"HEAD"})
    .then(r => { FRAMES_OK = r.ok; return r.ok; })
    .catch(() => { FRAMES_OK = false; return false; });
  return framesProbe;
}
function toFrames(eid, cam, v){
  if(v) clearTimeout(v._wd);
  probeFrames().then(ok => {
    if(!ok){                              // 프레임이 없는 배포 환경 → 영상 재시도
      if(v && v.isConnected && v.readyState < 2){ try{ v.load(); }catch(e){} armWatchdog(eid, cam, v); }
      return;
    }
    S.useFrames[fkey(eid, cam)] = true;
    applyMediaMode(eid, cam); syncOne(eid, true);
  });
}
/* 클립이 뒤늦게라도 열리면 영상 모드로 복귀 — 카메라 단위 */
function backToVideo(eid, cam, v){
  if(v) clearTimeout(v._wd);
  if(!S.useFrames[fkey(eid, cam)]) return;
  S.useFrames[fkey(eid, cam)] = false;
  applyMediaMode(eid, cam); syncOne(eid, true);
}

/* 에러 없이 멈춰 있는 경우(코덱 미지원·미디어 차단·백그라운드 탭·클립 생성 지연) 대비.
   정상 환경에선 가장 큰 클립도 1초 내로 열린다. 카메라마다 따로 건다. */
function armWatchdog(eid, cam, v){
  clearTimeout(v._wd);
  v._wd = setTimeout(()=>{
    if(!v.isConnected) return;              // 폐기된 카드의 타이머는 무시
    if(v.readyState < 2) toFrames(eid, cam, v);
  }, 8000);
}

/* 카드의 두 카메라 클립을 한 번에 물린다 */
function initMedia(eid, card){
  const c = card || cardOf(eid); if(!c) return;
  for(const cam of CAMS){
    const p = paneOf(c, cam); if(!p) continue;
    const v = p.querySelector("video"), img = p.querySelector("img");
    if(!v || !img) continue;
    clearTimeout(v._wd);
    S.useFrames[fkey(eid, cam)] = false;
    img.dataset.want = "";
    v.src = "/clip?eid="+encodeURIComponent(eid)+"&cam="+cam;
    v.load();
    armWatchdog(eid, cam, v);
  }
  applyMediaMode(eid);
  syncOne(eid);
}

function setFocus(eid){
  if(!eid || S.focus===eid) return;
  S.focus = eid;
  applyFocus();
  updateCursor();
}

function applyFocus(){
  document.querySelectorAll(".acard").forEach(c=>c.classList.toggle("focus", c.dataset.eid===S.focus));
  // 차트 불투명도: 시도1 = 1.0, 포커스 = 1.0, 나머지 = 0.45
  for(const ch of S.charts){
    ch.svg.querySelectorAll("path[data-eid]").forEach(p=>{
      const eid = p.dataset.eid;
      p.setAttribute("opacity", (eid===S.order[0] || eid===S.focus) ? "1" : "0.45");
    });
    ch.svg.querySelectorAll("text[data-eid]").forEach(t=>{
      t.setAttribute("opacity", t.dataset.eid===S.focus ? "1" : "0.5");
    });
    drawTrim(ch);
  }
}

/* ══════════════════════════════════════════════════════════════════
   차트 — SVG (viewBox "0 0 673 324", 플롯 47~661 / 12~286)
   ══════════════════════════════════════════════════════════════════ */
function scaleX(t){ return X0 + (S.dur>0 ? t/S.dur : 0) * (X1-X0); }
function scaleY(v, lo, hi){ const r = (hi-lo) || 1; return Y1 - (v-lo)/r * (Y1-Y0); }

// 축 눈금 간격 (nice number, 목표 12개 / 최대 16개)
function tickStep(max, target){
  if(!(max>0)) return 1;
  const raw = max/target, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  let best=null, bestD=Infinity;
  for(const m of [1,2,2.5,5,10]){
    for(const s of [mag*0.1, mag, mag*10]){
      const c = m*s, n = Math.floor(max/c + 1e-9);
      if(n < 2 || n > 16) continue;
      if(Math.abs(c*10 - Math.round(c*10)) > 1e-9) continue;   // 라벨이 소수 1자리이므로 0.1 배수만
      const d = Math.abs(n-target);
      if(d < bestD || (d===bestD && c < best)){ best=c; bestD=d; }   // 동률이면 촘촘한 쪽
    }
  }
  return best != null ? best : max/target;
}

// 균등 다운샘플(최대 700점) 경로 생성
function linePath(ts, get, lo, hi){
  const n = ts.length; if(!n) return "";
  const stride = Math.max(1, Math.ceil(n/MAXPTS));
  let d = "", started=false;
  const put = (i)=>{
    const v = get(i);
    if(v==null || !isFinite(v)) return;
    d += (started?"L":"M") + scaleX(ts[i]).toFixed(1) + "," + scaleY(v,lo,hi).toFixed(1);
    started = true;
  };
  for(let i=0;i<n;i+=stride) put(i);
  if((n-1) % stride !== 0) put(n-1);
  return d;
}

function buildCharts(){
  const box = $("charts"); box.textContent=""; S.charts = [];
  const specs = CHART_SPECS.slice();
  const isPress = S.group && (S.group.step===3 || S.group.step===6);
  for(const spec of specs) box.appendChild(makeChart(spec).panel);
  if(isPress){
    const lamp = makeLampChart();
    if(lamp) box.appendChild(lamp.panel);
  }
  applyFocus();
}

/* 공통 차트 골격 생성 */
function chartSkeleton(title){
  const panel = el("div","panel cpanel");
  panel.appendChild(el("div","ctitle", title));
  const svg = sv("svg", {viewBox:VB, width:"100%", preserveAspectRatio:"xMidYMid meet"});
  panel.appendChild(svg);

  const gBg   = sv("g",{class:"bg"});      svg.appendChild(gBg);
  const gGrid = sv("g",{class:"grid"});    svg.appendChild(gGrid);
  // y축 선 (아래쪽 x축 선은 없음)
  svg.appendChild(sv("path",{d:"M"+X0+","+Y0+"L"+X0+","+Y1, stroke:"#ccc", "stroke-width":"1", fill:"none"}));
  const gLab  = sv("g",{class:"lab"});     svg.appendChild(gLab);
  const gData = sv("g",{class:"data"});    svg.appendChild(gData);
  const gMark = sv("g",{class:"mark"});    svg.appendChild(gMark);
  const cursor = sv("line",{x1:X0,x2:X0,y1:Y0,y2:Y1,stroke:"rgba(255,255,255,0.75)","stroke-width":"1"});
  svg.appendChild(cursor);
  const gLg = sv("g",{class:"alg"});       svg.appendChild(gLg);

  // 가로 그리드 5줄
  for(const y of GRID_Y){
    gGrid.appendChild(sv("line",{x1:X0,x2:X1,y1:y,y2:y,
      stroke:GRID_COLOR,"stroke-dasharray":"3 3","stroke-width":"1"}));
  }
  return {panel, svg, gBg, gGrid, gLab, gData, gMark, gLg, cursor};
}

/* x축 눈금(세로 그리드 + 라벨) — 초 단위 */
function drawXAxis(ch){
  const step = tickStep(S.dur, 12);
  for(let t=step; t<=S.dur+1e-9; t+=step){
    const x = scaleX(t);
    ch.gGrid.appendChild(sv("line",{x1:x,x2:x,y1:Y0,y2:Y1,
      stroke:GRID_COLOR,"stroke-dasharray":"3 3","stroke-width":"1"}));
    const tx = sv("text",{x:x.toFixed(1), y:294, "font-size":"12px", fill:TICK_FILL, "text-anchor":"middle"});
    tx.textContent = t.toFixed(1)+"s";
    ch.gLab.appendChild(tx);
  }
}

/* y축 눈금 라벨 5개 (정수 반올림) */
function drawYAxis(ch, lo, hi){
  for(let k=0;k<5;k++){
    const y = GRID_Y[k];
    const v = hi - (hi-lo) * (k/4);
    const tx = sv("text",{x:41, y:(y+4).toFixed(1), "font-size":"12px", fill:TICK_FILL, "text-anchor":"end"});
    tx.textContent = String(Math.round(v));
    ch.gLab.appendChild(tx);
  }
}

/* 시도 범례(차트 우상단) */
function drawAttemptLegend(ch){
  let k=0;
  for(const eid of S.order){
    const a = (S.group.attempts||[]).find(x=>x.eid===eid); if(!a) continue;
    const oc = a.deleted ? "deleted" : (a.outcome||"unlabeled");
    const t = sv("text",{x:X1-4, y:24+k*13, "font-size":"11px", fill:"#cbd5e1",
                         "text-anchor":"end", "data-eid":eid});
    t.textContent = "Attempt " + (a.attempt||k+1) + " · " + oc;
    ch.gLg.appendChild(t); k++;
  }
}

/* 정지 트림 구간(포커스 시도 기준) — 배경 사각형 + 경계 세로 점선 */
function drawTrim(ch){
  ch.gBg.textContent = "";
  const old = ch.gMark.querySelector('[data-role="trim"]'); if(old) old.remove();
  const ep = S.eps[S.focus]; if(!ep) return;
  const tt = trimTime(ep); if(tt==null) return;
  const x = scaleX(tt);
  ch.gBg.appendChild(sv("rect",{x:x.toFixed(1), y:Y0, width:Math.max(0,X1-x).toFixed(1),
    height:(Y1-Y0), fill:"rgba(255,80,80,0.06)"}));
  ch.gMark.appendChild(sv("line",{x1:x.toFixed(1), x2:x.toFixed(1), y1:Y0, y2:Y1,
    stroke:"rgba(255,120,120,0.35)","stroke-dasharray":"4 4","stroke-width":"1","data-role":"trim"}));
}

/* 관절 차트 */
function makeChart(spec){
  const names = spec.joints.map(j=>JOINTS[j]);
  const ch = chartSkeleton(names.join(", "));
  ch.spec = spec;

  // y 도메인: 그룹 내 모든 시도 × 모든 시리즈(state/action)
  let lo=Infinity, hi=-Infinity;
  for(const eid of S.order){
    const ep = S.eps[eid]; if(!ep) continue;
    for(const src of [ep.state, ep.action]){
      if(!src) continue;
      for(let i=0;i<src.length;i++){
        const row = src[i]; if(!row) continue;
        for(const j of spec.joints){
          const v = row[j];
          if(v!=null && isFinite(v)){ if(v<lo) lo=v; if(v>hi) hi=v; }
        }
      }
    }
  }
  if(!isFinite(lo)||!isFinite(hi)){ lo=0; hi=1; }
  if(hi-lo < 1e-6){ lo-=1; hi+=1; }
  const pad = (hi-lo)*0.06; lo-=pad; hi+=pad;
  ch.lo=lo; ch.hi=hi;

  drawXAxis(ch);
  drawYAxis(ch, lo, hi);

  // 데이터 선: state = 실선, action = 점선("5 5")
  for(const eid of S.order){
    const ep = S.eps[eid]; if(!ep || !ep.t) continue;
    spec.joints.forEach((j, si)=>{
      const color = SERIES_COLORS[si % SERIES_COLORS.length];
      if(ep.state){
        const d = linePath(ep.t, i=>(ep.state[i]||[])[j], lo, hi);
        if(d) ch.gData.appendChild(sv("path",{d, fill:"none", stroke:color, "stroke-width":"1.5",
              "data-eid":eid, "data-j":String(j), "data-kind":"state"}));
      }
      if(ep.action){
        const d = linePath(ep.t, i=>(ep.action[i]||[])[j], lo, hi);
        if(d) ch.gData.appendChild(sv("path",{d, fill:"none", stroke:color, "stroke-width":"1.5",
              "stroke-dasharray":"5 5", "data-eid":eid, "data-j":String(j), "data-kind":"action"}));
      }
    });
  }
  drawAttemptLegend(ch);
  drawTrim(ch);

  // 하단 범례
  ch.panel.appendChild(buildLegend(ch, spec.joints.map((j,si)=>({
    key:String(j), name:JOINTS[j], color:SERIES_COLORS[si % SERIES_COLORS.length],
    kinds:[["action","action"],["state","observation.state"]],
  }))));

  applyHidden(ch);
  S.charts.push(ch);
  return ch;
}

/* 램프 차트 (press 스텝 3·6) */
function makeLampChart(){
  const any = S.order.map(e=>S.eps[e]).find(ep=>ep && ep.lamp && ep.lamp.m1);
  if(!any) return null;
  const ch = chartSkeleton("lamp m1, m2");
  ch.spec = {lamp:true};

  let lo=Infinity, hi=-Infinity;
  for(const eid of S.order){
    const ep=S.eps[eid]; if(!ep||!ep.lamp) continue;
    for(const arr of [ep.lamp.m1, ep.lamp.m2]){
      if(!arr) continue;
      for(const v of arr){ if(v!=null&&isFinite(v)){ if(v<lo)lo=v; if(v>hi)hi=v; } }
    }
    for(const thr of [ep.lamp.m1_thr, ep.lamp.m2_thr]){
      if(thr!=null&&isFinite(thr)){ if(thr<lo)lo=thr; if(thr>hi)hi=thr; }
    }
  }
  if(!isFinite(lo)||!isFinite(hi)){ lo=0; hi=255; }
  if(hi-lo<1e-6){ lo-=1; hi+=1; }
  const pad=(hi-lo)*0.06; lo-=pad; hi+=pad;
  ch.lo=lo; ch.hi=hi;

  drawXAxis(ch);
  drawYAxis(ch, lo, hi);

  for(const eid of S.order){
    const ep = S.eps[eid]; if(!ep||!ep.lamp||!ep.t) continue;
    [["m1",0],["m2",1]].forEach(([key,si])=>{
      const arr = ep.lamp[key]; if(!arr) return;
      const d = linePath(ep.t, i=>arr[i], lo, hi);
      if(d) ch.gData.appendChild(sv("path",{d, fill:"none", stroke:SERIES_COLORS[si],
            "stroke-width":"1.5", "data-eid":eid, "data-j":key, "data-kind":"state"}));
    });
  }
  // 임계선(점선) + 점등 시점 세로선 — 포커스 기준이 아니라 첫 시도 기준으로 고정
  const ep0 = S.eps[S.order[0]] || any;
  [["m1_thr",0],["m2_thr",1]].forEach(([key,si])=>{
    const thr = ep0.lamp ? ep0.lamp[key] : null;
    if(thr==null||!isFinite(thr)) return;
    const y = scaleY(thr, lo, hi);
    ch.gMark.appendChild(sv("line",{x1:X0,x2:X1,y1:y.toFixed(1),y2:y.toFixed(1),
      stroke:SERIES_COLORS[si], "stroke-dasharray":"5 5", "stroke-width":"1", opacity:"0.55"}));
  });
  for(const eid of S.order){
    const ep = S.eps[eid]; if(!ep) continue;
    const lf = (ep.metrics||{}).lamp_lit_frame;
    if(lf==null || !ep.t || lf>=ep.t.length) continue;
    const x = scaleX(ep.t[lf]);
    ch.gMark.appendChild(sv("line",{x1:x.toFixed(1),x2:x.toFixed(1),y1:Y0,y2:Y1,
      stroke:"#22c55e","stroke-width":"1", opacity:"0.8"}));
  }
  drawAttemptLegend(ch);
  drawTrim(ch);

  ch.panel.appendChild(buildLegend(ch, [
    {key:"m1", name:"lamp m1", color:SERIES_COLORS[0], kinds:[["state","value"]]},
    {key:"m2", name:"lamp m2", color:SERIES_COLORS[1], kinds:[["state","value"]]},
  ]));
  applyHidden(ch);
  S.charts.push(ch);
  return ch;
}

/* 차트 아래 범례: 관절명 한 줄 + 들여쓴 action / observation.state 두 줄 */
function buildLegend(ch, entries){
  const box = el("div","legend");
  ch.valEls = {};
  for(const e of entries){
    const blk = el("div","lg-j");

    const top = el("label");
    const cbj = el("input"); cbj.type="checkbox"; cbj.checked=true; cbj.style.accentColor=e.color;
    top.appendChild(cbj); top.appendChild(document.createTextNode(e.name));
    blk.appendChild(top);

    const sub = el("div","lg-sub");
    const subCbs = [];
    for(const [kind, label] of e.kinds){
      const hk = e.key+"|"+kind;
      const l = el("label");
      const cb = el("input"); cb.type="checkbox"; cb.checked = !S.hidden.has(hk); cb.style.accentColor = e.color;
      cb.onchange = ()=>{ cb.checked ? S.hidden.delete(hk) : S.hidden.add(hk); S.charts.forEach(applyHidden); };
      const val = el("span","val","—");
      ch.valEls[hk] = val;
      l.appendChild(cb); l.appendChild(document.createTextNode(label)); l.appendChild(val);
      sub.appendChild(l); subCbs.push([cb,hk]);
    }
    blk.appendChild(sub);
    cbj.onchange = ()=>{
      for(const [cb,hk] of subCbs){ cb.checked = cbj.checked; cbj.checked ? S.hidden.delete(hk) : S.hidden.add(hk); }
      S.charts.forEach(applyHidden);
    };
    box.appendChild(blk);
  }
  return box;
}

function applyHidden(ch){
  ch.svg.querySelectorAll("path[data-j]").forEach(p=>{
    const hk = p.dataset.j+"|"+p.dataset.kind;
    p.style.display = S.hidden.has(hk) ? "none" : "";
  });
}

/* ══════════════════════════════════════════════════════════════════
   재생 커서 / 범례 수치 — 재생 중에는 이것만 갱신
   ══════════════════════════════════════════════════════════════════ */
function frameAt(ep, t){
  const ts = ep.t; if(!ts||!ts.length) return 0;
  let lo=0, hi=ts.length-1;
  if(t<=ts[0]) return 0;
  if(t>=ts[hi]) return hi;
  while(lo<hi-1){ const mid=(lo+hi)>>1; if(ts[mid]<=t) lo=mid; else hi=mid; }
  return (t-ts[lo] <= ts[hi]-t) ? lo : hi;
}

function updateCursor(){
  const x = scaleX(clamp(S.T,0,S.dur)).toFixed(1);
  const ep = S.eps[S.focus];
  const i  = ep ? frameAt(ep, S.T) : 0;
  const past = ep ? (S.T > epDur(ep) + 1e-6) : false;

  for(const ch of S.charts){
    ch.cursor.setAttribute("x1", x); ch.cursor.setAttribute("x2", x);
    if(!ch.valEls) continue;
    for(const hk in ch.valEls){
      const [key, kind] = hk.split("|");
      let v = null;
      if(ep && !past){
        if(ch.spec && ch.spec.lamp){ const arr = ep.lamp && ep.lamp[key]; v = arr ? arr[i] : null; }
        else { const src = kind==="action" ? ep.action : ep.state; v = src ? (src[i]||[])[Number(key)] : null; }
      }
      ch.valEls[hk].textContent = (v==null||!isFinite(v)) ? "—" : Number(v).toFixed(2);
    }
  }
  $("tdisp").textContent = S.T.toFixed(2) + " / " + S.dur.toFixed(2) + " s";
  const pct = S.dur>0 ? (S.T/S.dur*100) : 0;
  const sk = $("seek");
  sk.value = String(Math.round(pct*10));
  sk.style.setProperty("--pct", pct.toFixed(2)+"%");
}

/* ══════════════════════════════════════════════════════════════════
   동기 재생 — 절대 시간(초) 기준으로 그룹 내 모든 영상 제어
   ══════════════════════════════════════════════════════════════════ */
/* 카드가 화면에 보이는가 — 안 보이면 currentTime 보정을 건너뛴다(동시 재생 8개) */
function inViewport(node){
  const r = node.getBoundingClientRect();
  if(r.width<=0 || r.height<=0) return false;
  const W = window.innerWidth || document.documentElement.clientWidth;
  const H = window.innerHeight || document.documentElement.clientHeight;
  return r.right > 0 && r.left < W && r.bottom > 0 && r.top < H;
}

function syncOne(eid, force){
  const c = cardOf(eid); if(!c) return;
  const ep = S.eps[eid];
  const dur = ep ? epDur(ep) : 0;
  const over = dur>0 && S.T > dur;                 // 짧은 영상은 끝에서 정지
  const t = over ? Math.max(0, dur-0.04) : S.T;
  const seekOk = !!force || inViewport(c);         // 성능 가드

  for(const cam of CAMS){
    const p = paneOf(c, cam); if(!p) continue;
    const v = p.querySelector("video"), img = p.querySelector("img");
    if(!v || !img) continue;

    if(S.useFrames[fkey(eid, cam)]){
      if(!ep) continue;
      const i = frameAt(ep, t);
      const want = "/frame?eid="+encodeURIComponent(eid)+"&cam="+cam+"&i="+i;
      if(img.dataset.want !== want){ img.dataset.want = want; img.src = want; }
      continue;
    }
    if(S.playing && !over){
      if(v.paused) v.play().catch(()=>{});
      if(seekOk && Math.abs(v.currentTime - t) > 0.22){ try{ v.currentTime = t; }catch(e){} }
    }else{
      if(!v.paused) v.pause();
      if(seekOk && Math.abs(v.currentTime - t) > 0.04){ try{ v.currentTime = t; }catch(e){} }
    }
  }
}
function syncAll(){ for(const eid of S.order) syncOne(eid); }

let raf=null, lastTS=0;
function tick(ts){
  if(!S.playing){ raf=null; return; }
  const dt = lastTS ? (ts-lastTS)/1000 : 0; lastTS = ts;
  S.T += dt;
  if(S.T >= S.dur){ S.T = S.dur; updateCursor(); syncAll(); pause(); return; }
  updateCursor(); syncAll();
  raf = requestAnimationFrame(tick);
}
function play(){
  if(S.playing || S.dur<=0) return;
  if(S.T >= S.dur - 1e-6) S.T = 0;
  S.playing = true; lastTS = 0;
  $("bPlay").classList.add("active");
  $("icPlay").style.display="none"; $("icPause").style.display="block";
  syncAll();
  raf = requestAnimationFrame(tick);
}
function pause(){
  S.playing = false;
  if(raf){ cancelAnimationFrame(raf); raf=null; }
  $("bPlay").classList.remove("active");
  $("icPlay").style.display="block"; $("icPause").style.display="none";
  syncAll();
}
function toggle(){ S.playing ? pause() : play(); }
function seekTo(t){ S.T = clamp(t, 0, S.dur); updateCursor(); syncAll(); }
function stepFrames(n){ pause(); seekTo(S.T + n/(S.fps||30)); }

$("bPlay").onclick  = toggle;
$("bBack").onclick  = ()=>{ pause(); seekTo(S.T-5); };
$("bFwd").onclick   = ()=>{ pause(); seekTo(S.T+5); };
$("bReset").onclick = ()=>{ pause(); seekTo(0); };
$("seek").oninput   = (e)=>{ pause(); seekTo(S.dur * (Number(e.target.value)/1000)); };

/* ══════════════════════════════════════════════════════════════════
   키보드
   ══════════════════════════════════════════════════════════════════ */
/* ↑↓ : 선택된 런 안에서 태스크 이동 */
function moveTask(d){
  const gs = curTasks(); if(!gs.length) return;
  const i = gs.findIndex(g=>g.gid===S.gid);
  const n = clamp((i<0?0:i) + d, 0, gs.length-1);
  if(n===i || !gs[n]) return;
  selectGroup(gs[n].gid);
  const it = $("tlist").querySelector('.row[data-gid="'+CSS.escape(gs[n].gid)+'"]');
  if(it) it.scrollIntoView({block:"nearest"});
}
/* ⇧↑↓ / PageUp·PageDown : 트라이 이동 (같은 태스크 번호 유지) */
function moveRun(d){
  if(!S.runs.length) return;
  const i = S.runs.findIndex(r=>r.run===S.run);
  const n = clamp((i<0?0:i) + d, 0, S.runs.length-1);
  if(n===i || !S.runs[n]) return;
  selectRun(S.runs[n].run);
  const ch = $("rlist").querySelector('.row[data-run="'+CSS.escape(S.runs[n].run)+'"]');
  if(ch) ch.scrollIntoView({block:"nearest"});
}

document.addEventListener("keydown", (e)=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input" || tag==="textarea" || tag==="select") return;
  const k = e.key;
  if(k===" "){ e.preventDefault(); toggle(); return; }
  if(k==="ArrowLeft"){  e.preventDefault(); stepFrames(e.shiftKey?-10:-1); return; }
  if(k==="ArrowRight"){ e.preventDefault(); stepFrames(e.shiftKey? 10: 1); return; }
  if(k==="ArrowUp" || k==="ArrowDown"){
    e.preventDefault();
    const d = (k==="ArrowDown") ? 1 : -1;
    if(e.shiftKey) moveRun(d); else moveTask(d);
    return;
  }
  if(k==="PageUp" || k==="PageDown"){          // ⇧↑↓ 대신 써도 되는 런 이동
    e.preventDefault();
    moveRun(k==="PageDown" ? 1 : -1);
    return;
  }
  if(k==="[" || k==="]"){
    e.preventDefault();
    const i = S.order.indexOf(S.focus);
    const n = clamp((i<0?0:i) + (k==="]"?1:-1), 0, S.order.length-1);
    setFocus(S.order[n]);
    return;
  }
});
</script>
