<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rollout viewer</title>
<!-- 서버에 favicon.ico 라우트가 없어 콘솔에 404 가 남는다. 빈 아이콘으로 막는다. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/viewer.css">
</head>
<body>

<div class="app">
  <!-- ── 사이드바 ───────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="side-top">
      <div class="stats" id="stats"></div>
    </div>
    <!-- Finder 컬럼 뷰 2단: Run(실험) | Task — Task 선택이 곧 화면 선택 (그 Task 를 모든 Try 에서 수행한 카드) -->
    <div class="cols">
      <div class="col col-run">
        <div class="side-h">Run <span class="n" id="ecount"></span></div>
        <div class="clist" id="elist" role="listbox" aria-label="Run list"></div>
      </div>
      <div class="col col-task">
        <div class="side-h">Task <span class="n" id="tcount"></span></div>
        <div class="clist" id="tlist" role="listbox" aria-label="Task list"></div>
      </div>
    </div>
  </aside>

  <!-- ── 메인: 선택한 Task 의 카드를 Try 순으로 한 그리드에 가로로 타일링 ──── -->
  <main class="main" id="main">
    <div class="wrap">
      <!-- 머리줄은 sticky — 스크롤해도 어느 Task 를 보고 있는지·토글들이 남는다 -->
      <div class="mhead">
        <div class="mhead-l">
          <h1 id="gTitle">rollout viewer</h1>
          <div class="sub lbl" id="gSub">loading…</div>
        </div>
        <div class="mhead-r">
          <div class="ctrls">
            <!-- 전역 오버레이 모드 — 화면 전체 카드를 한 번에 (카드의 ◉ 토글로 개별 덮어쓰기 가능) -->
            <div class="seg" id="vmodeSeg" role="group" aria-label="overlay mode for all cards">
              <button type="button" data-mode="attn"   title="Attention overlay on every card that has it">Attention</button>
              <button type="button" data-mode="causal" title="Causal (occlusion) overlay on every card that has it">Causal</button>
              <button type="button" data-mode="orig"   title="Original clips on every card">Original</button>
            </div>
            <label class="atoggle" title="When on, every attempt of each try (failed retries included) is shown, same try side by side (fail → success)">
              <input type="checkbox" id="showAll">Show all attempts
            </label>
          </div>
          <div class="hints">
            <span class="kbd">Space</span> play
            <span class="kbd">←→</span> frame
            <span class="kbd">↑↓</span> task
            <span class="kbd">⌥↑↓</span> run
            <span class="kbd">[ ]</span> card
          </div>
        </div>
      </div>

      <!-- 카드 그리드 (main.js renderTask() 가 채운다) — .tgroup(같은 Try 의 시도 묶음) > .acard -->
      <div class="grid" id="grid"></div>

      <!-- 접이식 차트 — 포커스 카드의 (Run, Try, Task) 그룹(시도 겹침). 기본 접힘 -->
      <details class="chartsbox" id="chartsBox">
        <summary><span id="chartsSum">Charts</span><span class="lbl chartsHint">focused card's group · click a card to change</span></summary>
        <div class="charts" id="charts"></div>
      </details>

      <footer class="credit"><a href="https://github.com/nevertmr">nevertmr</a> &middot; Minseo Kim</footer>
    </div>

    <!-- 전역 재생바 — 하단 고정, 화면의 모든 카드를 동시에 동기 재생 -->
    <div class="gbar" id="gbar">
      <button class="pbtn32" id="gBack" title="back 5s" aria-label="back 5 seconds">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6L11 18zm.5-6l8.5 6V6l-8.5 6z"/></svg>
      </button>
      <button class="pbtn32" id="gPlay" title="play/pause (Space)" aria-label="play or pause">
        <svg class="icPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button class="pbtn32" id="gFwd" title="forward 5s" aria-label="forward 5 seconds">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8.5-6L13 6zm-.5 6L4 6v12l8.5-6z"/></svg>
      </button>
      <button class="pbtn32" id="gReset" title="restart" aria-label="restart from the beginning">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <input class="seek" id="gSeek" type="range" min="0" max="1000" value="0" step="1" title="seek" aria-label="seek">
      <div class="tdisp" id="gTdisp">0.00 / 0.00 s</div>
      <div class="gfocus lbl" id="gFocus" title="focused card"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/static/js/config.js"></script>
<script src="/static/js/state.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/media.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
